name: N60 Pro - ImmortalWrt 6.12 + Honk

on:
  schedule:
    # UTC Monday 00:00 = Asia/Shanghai Monday 08:00.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: 'Existing successful build run ID to publish without rebuilding (leave empty for a full build)'
        required: false
        type: string
        default: ''
      cleanup_only:
        description: 'Only clean workflow history; keep the latest 10 runs without building or publishing'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - '.github/workflows/build-honk.yml'
      - 'build.env'
      - 'feeds.conf.default'
      - 'feeds.conf.custom'
      - 'custom.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'immortalwrt-netcore-n60-pro-honk.config'
      - 'scripts/**'
      - 'files/**'

permissions:
  contents: read

concurrency:
  group: honk-${{ inputs.cleanup_only && 'cleanup' || 'firmware' }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  OPENWRT_DIR: /workdir/openwrt

jobs:
  build:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (!inputs.cleanup_only && inputs.publish_run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      firmware_artifact_id: ${{ steps.firmware.outputs.artifact-id }}
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration inputs
        run: |
          mkdir -p build-logs
          bash scripts/check-config.sh

      - name: Prepare Linux build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev dwarves \
            python3 python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget curl ccache device-tree-compiler jq pkgconf \
            subversion tar zstd xsltproc quilt libtool autoconf automake \
            autopoint cmake ninja-build libgmp-dev libmpc-dev libmpfr-dev
          sudo apt-get clean
          sudo mkdir -p /workdir
          sudo chown "$(id -u):$(id -g)" /workdir
          df -hT /workdir

      - name: Prepare latest firmware and feed sources
        run: bash scripts/prepare-source.sh "$OPENWRT_DIR" 2>&1 | tee build-logs/prepare.log

      - name: Expand and verify build configuration
        run: |
          cd "$OPENWRT_DIR"
          make defconfig 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/defconfig.log"
          python3 "$GITHUB_WORKSPACE/scripts/validate.py" defconfig-log \
            "$GITHUB_WORKSPACE/build-logs/defconfig.log"
          python3 "$GITHUB_WORKSPACE/scripts/validate.py" config .config --expanded \
            --version-file firmware-version.json --package-info tmp/.packageinfo
          python3 "$GITHUB_WORKSPACE/scripts/customize.py" check-config custom-options.config .config
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/build-logs/config.diff"
          cp .config "$GITHUB_WORKSPACE/build-logs/expanded.config"
          cp build-inputs.txt "$GITHUB_WORKSPACE/build-logs/"
          cp firmware-version.json "$GITHUB_WORKSPACE/build-logs/"
          cp custom-options.config feeds.conf.default "$GITHUB_WORKSPACE/build-logs/"
          echo "FIRMWARE_TAG=$(jq -r .filename_tag firmware-version.json)" >> "$GITHUB_ENV"
          echo "FIRMWARE_LABEL=$(jq -r .display_label firmware-version.json)" >> "$GITHUB_ENV"

      - name: Download sources
        run: |
          cd "$OPENWRT_DIR"
          (make download -j8 || make download -j1 V=s) 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/download.log"

      - name: Compile firmware
        run: |
          cd "$OPENWRT_DIR"
          (make -j"$(nproc)" || make -j1 V=s) 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/compile.log"

      - name: Verify actual kernel and installed packages
        run: |
          mapfile -t kernel_configs < <(find "$OPENWRT_DIR/build_dir" -type f \
            -path '*/linux-mediatek_filogic/linux-6.12*/.config')
          if [[ ${#kernel_configs[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one target kernel configuration'
            exit 1
          fi
          python3 scripts/validate.py kernel "${kernel_configs[0]}"
          cp "${kernel_configs[0]}" build-logs/kernel.config
          shopt -s nullglob
          manifests=("$OPENWRT_DIR"/bin/targets/mediatek/filogic/*netcore_n60-pro*.manifest)
          if [[ ${#manifests[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one N60 Pro firmware manifest'
            exit 1
          fi
          python3 scripts/validate.py manifest "${manifests[0]}"
          python3 scripts/customize.py check-manifest "$OPENWRT_DIR/custom-options.config" \
            "${manifests[0]}" --package-info "$OPENWRT_DIR/tmp/.packageinfo"

      - name: Verify version embedded in the firmware rootfs
        run: |
          mapfile -t release_files < <(find "$OPENWRT_DIR/build_dir" -type f \
            -path '*/root-mediatek/etc/openwrt_release')
          if [[ ${#release_files[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one target rootfs release file'
            exit 1
          fi
          python3 scripts/validate.py release "${release_files[0]}" \
            --version-file "$OPENWRT_DIR/firmware-version.json"
          cp "${release_files[0]}" build-logs/openwrt_release
          rootfs_dir=$(dirname -- "$(dirname -- "${release_files[0]}")")
          python3 scripts/validate.py ui "$rootfs_dir"
          cmp -- files/etc/uci-defaults/zz-honk-ui "$rootfs_dir/etc/uci-defaults/zz-honk-ui"
          cmp -- files/etc/uci-defaults/99-honk-routing "$rootfs_dir/etc/uci-defaults/99-honk-routing"
          cmp -- files/etc/uci-defaults/zz-openclash-backup "$rootfs_dir/etc/uci-defaults/zz-openclash-backup"

      - name: Collect N60 Pro firmware
        run: |
          target_dir="$OPENWRT_DIR/bin/targets/mediatek/filogic"
          mkdir -p artifacts
          shopt -s nullglob
          images=("$target_dir"/*"$FIRMWARE_TAG"*netcore_n60-pro*-sysupgrade.itb)
          if [[ ${#images[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one N60 Pro sysupgrade.itb'
            exit 1
          fi
          cp "${images[0]}" artifacts/
          for output in "$target_dir"/*netcore_n60-pro*-recovery.itb \
                        "$target_dir"/*netcore_n60-pro*.manifest \
                        "$target_dir"/*netcore_n60-pro*.json \
                        "$target_dir"/*.buildinfo; do
            cp "$output" artifacts/
          done
          cp build-logs/expanded.config artifacts/
          cp build-logs/kernel.config artifacts/
          cp build-logs/config.diff artifacts/
          cp build-logs/openwrt_release artifacts/
          cp "$OPENWRT_DIR/firmware-version.json" artifacts/
          cp "$OPENWRT_DIR/build-inputs.txt" artifacts/
          cp "$OPENWRT_DIR/custom-options.config" "$OPENWRT_DIR/feeds.conf.default" artifacts/
          cat > artifacts/DEVICE-LAYOUT.txt <<'EOF'
          Netcore N60 Pro / ImmortalWrt openwrt-25.12 / Linux 6.12 / UBI-FIT
          This image requires the matching upstream UBI/FIT boot and partition layout.
          The old padavanonly 6.6 NMBM sysupgrade.bin layout is different.
          Review README.md and your actual bootloader/partition layout before flashing.
          Honk is installed with upstream defaults; initialize it in LuCI after boot.
          OpenClash is a disabled backup UI; download its ARM64 core at runtime before use.
          EOF
          cd artifacts
          sha256sum -- * > sha256sums

      - name: Upload verified firmware
        id: firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netcore-n60-pro-honk-${{ env.FIRMWARE_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload configuration and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: honk-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            /workdir/openwrt/.config
            /workdir/openwrt/build-inputs.txt
            /workdir/openwrt/firmware-version.json
            /workdir/openwrt/custom-options.config
            /workdir/openwrt/feeds.conf.default
            /workdir/openwrt/tmp/.config-package.in
            /workdir/openwrt/tmp/.packageinfo
            /workdir/openwrt/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo '### Netcore N60 Pro / Honk'
            echo 'Source: ImmortalWrt openwrt-25.12 / Linux 6.12 / mediatek-filogic.'
            if [[ -n ${FIRMWARE_LABEL:-} ]]; then
              echo "Custom version: $FIRMWARE_LABEL (Asia/Shanghai build date)."
            fi
            echo 'Firmware is uploaded only after kernel and package manifest checks pass.'
            echo 'The UBI/FIT sysupgrade.itb requires the matching bootloader and partition layout.'
            echo 'See honk-build-logs for the actual firmware and feed commits, configuration and logs.'
          } >> "$GITHUB_STEP_SUMMARY"
          df -hT /workdir || true

  publish:
    needs: build
    if: >-
      always() && !cancelled() && !inputs.cleanup_only &&
      (needs.build.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout publication scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve verified firmware artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          BUILT_ARTIFACT_ID: ${{ needs.build.outputs.firmware_artifact_id }}
        run: |
          if [[ -n $PUBLISH_RUN_ID ]]; then
            [[ $PUBLISH_RUN_ID =~ ^[1-9][0-9]*$ ]] || {
              echo '::error::publish_run_id must be a positive run ID'
              exit 1
            }
            source_run_id=$PUBLISH_RUN_ID
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" > "$RUNNER_TEMP/source-run.json"
            jq -e '.conclusion == "success" and .path == ".github/workflows/build-honk.yml"' \
              "$RUNNER_TEMP/source-run.json" > /dev/null
            target_sha=$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")
            source_attempt=$(jq -r .run_attempt "$RUNNER_TEMP/source-run.json")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" \
              > "$RUNNER_TEMP/source-artifacts.json"
            artifact_id=$(jq -r --arg suffix "-$source_run_id-$source_attempt" '
              .artifacts | map(select(.expired == false and
                (.name | startswith("netcore-n60-pro-honk-")) and
                (.name | endswith($suffix)))) |
              if length == 1 then .[0].id else error("Expected exactly one verified firmware artifact") end
              ' "$RUNNER_TEMP/source-artifacts.json")
          else
            source_run_id=$GITHUB_RUN_ID
            source_attempt=$GITHUB_RUN_ATTEMPT
            target_sha=$GITHUB_SHA
            artifact_id=$BUILT_ARTIFACT_ID
          fi
          {
            echo "artifact_id=$artifact_id"
            echo "source_run_id=$source_run_id"
            echo "source_attempt=$source_attempt"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Download verified firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          path: artifacts
          merge-multiple: true

      - name: Publish firmware to Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: |
          python3 -B scripts/publish_release.py artifacts \
            --repository "$GITHUB_REPOSITORY" --target "$TARGET_SHA" \
            --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_ATTEMPT" \
            --output "$RUNNER_TEMP/firmware-release"

  cleanup:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    concurrency:
      group: honk-history-cleanup-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout cleanup scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate history cleanup
        run: python3 -B scripts/test_cleanup_runs.py

      - name: Keep the latest 10 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/cleanup_runs.py --repository "$GITHUB_REPOSITORY" \
            --keep 10 --current-run-id "$GITHUB_RUN_ID" --apply
